<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clicker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- КНОПКА НАСТРОЕК -->
  <button id="settingsBtn">⚙️</button>

  <!-- ИГРА -->
  <div id="game">
    <div id="balance">0 c</div>
    <div id="perClick">+1 c за клик</div>

    <button id="clickBtn">КЛИК</button>

    <!-- ПРОКАЧКА -->
    <div id="upgrade">
      <div>Прокачка клика</div>
      <div id="upgradeInfo">+0.5 c</div>
      <button id="upgradeBtn">Купить за 10 c</button>
    </div>
  </div>

  <!-- НАСТРОЙКИ -->
  <div id="settings" class="hidden">
    <div class="panel">
      <h2>Настройки</h2>

      <label><input type="checkbox" checked> 🔊 Звук</label>
      <label><input type="checkbox" checked> 📳 Вибрация</label>
      <label><input type="checkbox" checked> 🌙 Тёмная тема</label>

      <button id="closeSettings">Закрыть</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
