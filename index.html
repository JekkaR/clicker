<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CATBOOM</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN -->
<div id="login" class="screen">
  <h1>🐱 CATBOOM</h1>
  <p>Империя кошек</p>
  <input id="nickname" placeholder="Введите ник">
  <button id="playBtn">Играть</button>
</div>

<!-- GAME -->
<div id="game" class="screen hidden">

  <!-- TOP -->
  <div class="top">
    <div>Баланс: <span id="balance">0</span>k</div>
    <div>+<span id="perClick">1</span>k / клик</div>
  </div>

  <!-- MAIN -->
  <div class="main tab active" id="tab-main">
    <button id="clickBtn" class="big-btn">КЛИК 🐾</button>
    <div>Пассив: +<span id="passive">0</span>k / сек</div>
  </div>

  <!-- SHOP -->
  <div class="tab" id="tab-shop">
    <h2>🛒 Магазин</h2>
    <p>Скоро...</p>
  </div>

  <!-- CATS -->
  <div class="tab" id="tab-cats">
    <h2>🐱 Коты</h2>
    <p>Скоро...</p>
  </div>

  <!-- FACTORY -->
  <div class="tab" id="tab-factory">
    <h2>🏭 Завод</h2>
    <p>Скоро...</p>
  </div>

  <!-- SETTINGS -->
  <div class="tab" id="tab-settings">
    <h2>⚙️ Настройки</h2>
    <button onclick="resetGame()">Сброс</button>
  </div>

  <!-- NAV -->
  <div class="nav">
    <button data-tab="main">🏠</button>
    <button data-tab="shop">🛒</button>
    <button data-tab="cats">🐱</button>
    <button data-tab="factory">🏭</button>
    <button data-tab="settings">⚙️</button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
