<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CATBOOM</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">

  <!-- LOGIN -->
  <div id="login" class="screen">
    <h1>🐱 CATBOOM</h1>
    <input type="text" id="nickname" placeholder="Введи ник" />
    <button onclick="startGame()">PLAY</button>
  </div>

  <!-- GAME -->
  <div id="game" class="screen hidden">

    <!-- HEADER -->
    <div class="header">
      <div>Баланс: <span id="balance">0</span> k</div>
      <div>За клик: <span id="perClick">1</span> k</div>
    </div>

    <!-- TABS -->
    <div class="tab active" id="tab-main">
      <div class="cat-area">
        <img src="https://i.imgur.com/3ZQ3ZQF.png" class="cat" />
        <button class="click-btn" onclick="clickCat()">КЛИК 🐾</button>
      </div>
    </div>

    <div class="tab" id="tab-shop">
      <h2>🛒 Магазин</h2>
      <button onclick="buyUpgrade()">Прокачка (+0.5 за клик) — <span id="upgradePrice">10</span> k</button>
    </div>

    <div class="tab" id="tab-cats">
      <h2>🐈 Коты</h2>
      <p>Скоро тут будут мемные коты 😼</p>
    </div>

    <div class="tab" id="tab-settings">
      <h2>⚙️ Настройки</h2>
      <button onclick="resetGame()">Сброс</button>
    </div>

    <!-- NAV -->
    <nav>
      <button onclick="openTab('main')">🏠</button>
      <button onclick="openTab('shop')">🛒</button>
      <button onclick="openTab('cats')">🐱</button>
      <button onclick="openTab('settings')">⚙️</button>
    </nav>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
