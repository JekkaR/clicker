<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>CATBOOM: Империя кошек</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="auth" class="screen">
  <h1>CATBOOM</h1>
  <input id="nicknameInput" placeholder="Введите ник" />
  <button onclick="startGame()">Играть</button>
</div>

<div id="game" class="screen hidden">

  <header>
    <div>👤 <span id="nickname"></span></div>
    <div>💰 <span id="balance">0</span> k</div>
  </header>

  <div class="stats">
    <div>👆 За клик: <span id="perClick">1</span> k</div>
    <div>💤 В ожидании: <span id="perSecond">0.5</span> k/сек</div>
  </div>

  <button class="click-btn" onclick="clickCat()">КЛИК</button>

  <nav>
    <button onclick="openTab('shop')">Магазин</button>
    <button onclick="openTab('cats')">Коты</button>
    <button onclick="openTab('factory')">Завод</button>
  </nav>

  <div id="shop" class="tab">
    <h2>Магазин</h2>
    <button onclick="buyClick()">+0.5 к клику ( <span id="clickPrice">10</span> k )</button>
    <button onclick="buyIdle()">+0.25 к ожиданию ( <span id="idlePrice">15</span> k )</button>
  </div>

  <div id="cats" class="tab hidden">
    <h2>Коты</h2>
    <button onclick="buyCat(0)">🐱 Бедолага (100)</button>
    <button onclick="buyCat(1)">😼 Обычный (1000)</button>
    <button onclick="buyCat(2)">😎 Бизнесмен (10000)</button>
  </div>

  <div id="factory" class="tab hidden">
    <h2>Завод</h2>
    <div>Котов: <span id="factoryCats">0</span> / <span id="factoryLimit">5</span></div>
    <button onclick="upgradeFactory()">Расширить завод ( <span id="factoryPrice">500</span> )</button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
