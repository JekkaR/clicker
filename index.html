<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>catboom</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <div class="balance">
      Баланс<br>
      <span id="balance">0</span> c
    </div>

    <div class="title">catboom</div>

    <button id="settingsBtn" class="settings">⚙️</button>
  </div>

  <!-- MAIN -->
  <div class="main">
    <button id="clickBtn" class="click-circle">
      КЛИК
    </button>
  </div>

  <!-- UPGRADE -->
  <div class="upgrade">
    <div class="upgrade-title">Прокачка</div>
    <div class="upgrade-info">
      <span id="upgradeText">+0.5c за клик</span>
      <span id="upgradeCost">10c</span>
    </div>
    <button id="upgradeBtn" class="buy">КУПИТЬ</button>
  </div>

  <!-- SETTINGS -->
  <div id="settings" class="modal hidden">
    <div class="modal-box">
      <h2>Настройки</h2>
      <label><input type="checkbox" checked> 🔊 Звук</label>
      <label><input type="checkbox" checked> 📳 Вибрация</label>
      <label><input type="checkbox" checked> 🌙 Тёмная тема</label>
      <button id="closeSettings">Закрыть</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
