<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>CATBOOM: Империя кошек</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="auth" class="screen">
  <h1>🐱 CATBOOM</h1>
  <input id="nicknameInput" placeholder="Введите ник">
  <button id="playBtn">Играть</button>
</div>

<div id="game" class="screen hidden">

  <header>
    <span>👤 <b id="nickname"></b></span>
    <span>💰 <b id="balance">0</b> k</span>
  </header>

  <div class="center">
    <div class="cat">🐱</div>
    <button class="click-btn" id="clickBtn">КЛИК</button>

    <div class="stats">
      <div>👆 За клик: <b id="perClick">1</b> k</div>
      <div>💤 В ожидании: <b id="perSecond">0.5</b> k/сек</div>
    </div>
  </div>

  <nav>
    <button data-tab="shop">🛒</button>
    <button data-tab="cats">🐱</button>
    <button data-tab="factory">🏭</button>
  </nav>

  <div id="shop" class="tab">
    <h2>Магазин</h2>
    <button id="buyClickBtn">+0.5 к клику (<span id="clickPrice"></span>k)</button>
    <button id="buyIdleBtn">+0.25 к ожиданию (<span id="idlePrice"></span>k)</button>
  </div>

  <div id="cats" class="tab hidden">
    <h2>Коты</h2>
    <div id="catsList"></div>
  </div>

  <div id="factory" class="tab hidden">
    <h2>Завод</h2>
    <p>Котов работает: <b id="factoryCats">0</b> / <b id="factoryLimit">5</b></p>
    <p>Доход: <b id="factoryIncome">0</b> k/сек</p>
    <button id="upgradeFactoryBtn">
      Расширить завод (<span id="factoryPrice"></span>k)
    </button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
