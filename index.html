<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>CATBOOM Clicker</title>

  <!-- Telegram WebApp -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- КНОПКА НАСТРОЕК -->
  <button id="openSettings" class="gear">⚙️</button>

  <!-- ОВЕРЛЕЙ -->
  <div id="overlay" class="overlay hidden"></div>

  <!-- НАСТРОЙКИ -->
  <div id="settings" class="settings hidden">
    <h3>Настройки</h3>

    <label><input type="checkbox" checked> 🔊 Звук</label>
    <label><input type="checkbox" checked> 📳 Вибрация</label>
    <label><input type="checkbox" checked> 🌙 Тёмная тема</label>

    <button id="closeSettings" class="close-btn">Закрыть</button>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
